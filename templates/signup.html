<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | VocaNova</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
  <header class="page-topbar">
    <nav class="page-nav" aria-label="Main navigation">
      <a href="{{ url_for('login_page') }}" class="nav-chip">Home</a>
      <a href="{{ url_for('login_page') }}" class="nav-chip">Login</a>
      <a href="{{ url_for('signup_page') }}" class="nav-chip active">Create account</a>
    </nav>
  </header>
  <main class="auth-shell">
    <section class="auth-card">
      <p class="eyebrow"><span class="eyebrow-line"></span> CREATE ACCOUNT</p>
      <h1>Join the studio</h1>
      {% if error %}
        <p class="form-error">{{ error }}</p>
      {% endif %}
      <form method="post" action="{{ url_for('api_signup') }}" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ session.get('csrf_token', '') }}">
        <label>
          <span>Full name</span>
          <input type="text" name="name" required placeholder="Your name">
        </label>
        <label>
          <span>Email</span>
          <input type="email" name="email" required placeholder="you@example.com">
        </label>
        <label>
          <span>Password</span>
          <div class="password-field">
            <input type="password" name="password" required minlength="8" placeholder="At least 8 characters" class="password-input">
            <button type="button" class="password-toggle" aria-label="Show password">Show</button>
          </div>
        </label>
        <label>
          <span>Confirm password</span>
          <div class="password-field">
            <input type="password" name="confirm_password" required placeholder="Repeat password" class="password-input">
            <button type="button" class="password-toggle" aria-label="Show password">Show</button>
          </div>
        </label>
        <button type="submit" class="primary-button">Create account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="{{ url_for('login_page') }}">Login</a></p>
      <p class="auth-link-back"><a href="{{ url_for('login_page') }}">Return to login</a></p>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</body>
</html>
